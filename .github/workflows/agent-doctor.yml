name: Agent Doctor

on:
  pull_request:
  push:
    branches: [main]

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # yuntro is a local CLI (not published to npm), so the real check
      # runs locally via `yuntro doctor`. In CI we only verify that the
      # operating model file exists and is parseable YAML.
      - name: Validate operating model presence
        run: |
          test -f .agent/operating-model.yaml || { echo "Missing .agent/operating-model.yaml"; exit 1; }
          python3 -c "import yaml,sys; yaml.safe_load(open('.agent/operating-model.yaml'))" \
            && echo "operating-model.yaml is valid YAML"

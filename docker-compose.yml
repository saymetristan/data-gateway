services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: data-gateway-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: data_gateway
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d data_gateway']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
